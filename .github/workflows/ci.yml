name: ApexBank Platform CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # Job 1: Verify Spring Boot Microservices
  verify-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [account-service, transaction-service, compliance-service]
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Run Maven Build & Tests
      run: |
        cd backend/${{ matrix.service }}
        mvn clean test

  # Job 2: Verify Python Antigravity Agent
  verify-agent:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r agent/requirements.txt

    - name: Run Pytest suite
      run: |
        PYTHONPATH=. pytest agent/test_agent.py

  # Job 3: Verify Next.js React Frontend Dashboard
  verify-frontend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Build Next.js Dashboard
      run: |
        cd frontend
        npm run build
